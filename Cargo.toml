[package]
name = "nostrd"
version = "0.1.0"
edition = "2024"
description = "A minimal and stable Nostr relay server"
license = "MIT"
repository = "https://github.com/iqbqioza/nostrd"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
daemonize = "0.5"
env_logger = "0.11"
futures-util = "0.3"
getrandom = "0.2"
heed = "0.20"
hex = "0.4"
libc = "0.2"
log = "0.4"
secp256k1 = { version = "0.30", features = ["std", "hashes"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
