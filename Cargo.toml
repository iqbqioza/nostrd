[package]
name = "nostrd"
version = "0.1.2"
edition = "2024"
description = "A minimal and stable Nostr relay server"
license = "MIT"
repository = "https://github.com/iqbqioza/nostrd"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
daemonize = "0.5"
env_logger = "0.11"
futures-util = "0.3"
getrandom = "0.2"
heed = "0.20"
hex = "0.4"
libc = "0.2"
log = "0.4"
secp256k1 = { version = "0.30", features = ["std", "hashes"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# S3/R2 (Cloudflare R2 is S3-compatible) storage for the Blossom file server;
# rustls provides the TLS the S3 API requires.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs"] }
toml = "0.8"

# Release build tuning: full LTO across all crates, single codegen unit and
# stripped symbols give the best runtime performance and the smallest binary
# at the cost of a slower build. `panic = "unwind"` is required: the database
# threads recover from panics with `catch_unwind`, which `panic = "abort"`
# would silently disable (a panic would then kill the whole relay).
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
