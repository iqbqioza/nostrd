name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: nostrd-linux-x86_64
          # Native ARM64 runner (GitHub-hosted, public repos).
          - os: ubuntu-24.04-arm
            asset: nostrd-linux-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp target/release/nostrd "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
          (cd dist && tar -czf "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}")
          (cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  freebsd:
    name: Build (nostrd-freebsd-x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          # Pin a stable release: the action's default tracks FreeBSD
          # -CURRENT, which breaks CI with unrelated upstream churn.
          release: "14.2"
          prepare: |
            pkg update -f
            pkg install -y rust
          run: |
            cargo build --release
            mkdir -p dist
            cp target/release/nostrd "dist/nostrd-freebsd-x86_64"
            chmod +x "dist/nostrd-freebsd-x86_64"
            (cd dist && tar -czf "nostrd-freebsd-x86_64.tar.gz" "nostrd-freebsd-x86_64")
            (cd dist && sha256 -r "nostrd-freebsd-x86_64" > "nostrd-freebsd-x86_64.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: nostrd-freebsd-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build, freebsd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release with release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/nostrd-linux-x86_64 \
            dist/nostrd-linux-x86_64.tar.gz \
            dist/nostrd-linux-x86_64.sha256 \
            dist/nostrd-linux-aarch64 \
            dist/nostrd-linux-aarch64.tar.gz \
            dist/nostrd-linux-aarch64.sha256 \
            dist/nostrd-freebsd-x86_64 \
            dist/nostrd-freebsd-x86_64.tar.gz \
            dist/nostrd-freebsd-x86_64.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "See the commit history for changes in this release." \
            --generate-notes